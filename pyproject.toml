[project]
name = "biodesign-vat-demo"
version = "0.1.0"
description = "Reference implementation of the RAND PE-A4613-1 verifiable audit trail protocol for AI-enabled biological design, with the recorder hosted on Modal."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=39",
    "pymerkle>=6.1",
    "rfc8785>=0.1",
]

[project.optional-dependencies]
modal = ["modal>=1.5.5,<1.6"]
serve = ["modal>=1.5.5,<1.6", "fastapi", "gemmi>=0.7,<0.8"]
workflow = ["fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30", "python-dotenv>=1.0", "mcp>=1.30,<2", "gemmi>=0.7,<0.8"]
review = ["anthropic>=0.40"]
benchbb = ["pyarrow>=15"]
public-transparency = ["sigstore>=4.5,<5", "rfc3161-client>=1.0.9,<2", "google-auth>=2.30,<3"]
dev = ["pytest>=7.4", "coverage>=7.10.6,<8", "modal>=1.5.5,<1.6", "fastapi>=0.115", "httpx>=0.27", "python-dotenv>=1.0", "mcp>=1.30,<2", "gemmi>=0.7,<0.8", "sigstore>=4.5,<5", "rfc3161-client>=1.0.9,<2", "google-auth>=2.30,<3"]

[project.scripts]
vat-claude-science-mcp = "runner.claude_science_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
runner = ["locks/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vatlog", "runner", "demo"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
